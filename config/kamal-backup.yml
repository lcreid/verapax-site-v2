app: verapax_site
accessory: backup
databases:
  - name: verapax-site
    adapter: sqlite
    path: /rails/storage/production.sqlite3
paths:
  - path: /rails/storage
    exclude:
      - /rails/storage/*.sqlite3
      - /rails/storage/*.sqlite3-wal
      - /rails/storage/*.sqlite3-shm
restic:
  repository: sftp:backup@fs-2:/NetBackup/restic
  password:
    secret: RESTIC_PASSWORD
  init_if_missing: true
  check_after_backup: true
  check_read_data_subset: 5%
  retention:
    keep_last: 7
    keep_daily: 7
    keep_weekly: 4
    keep_monthly: 6
    keep_yearly: 2
backup:
  schedule: 1d
